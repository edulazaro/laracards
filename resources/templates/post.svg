<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">

  <defs>
    <!-- Scrim: keeps the text readable no matter how busy the photo is. -->
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#000000" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.92"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="630"/>
    </clipPath>
  </defs>

  <!-- Base colour, visible when there is no background image. -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Background layer. Solid, Unsplash photo or an image generated elsewhere:
       all three arrive here as the same data URI, so the template never changes. -->
  {{#background_uri}}
  <g clip-path="url(#frame)">
    <image x="0" y="0" width="1200" height="630"
           preserveAspectRatio="xMidYMid slice"
           href="__BACKGROUND_URI__" xlink:href="__BACKGROUND_URI__"/>
  </g>
  {{/background_uri}}

  <rect width="1200" height="630" fill="url(#scrim)"/>

  {{#logo_uri}}<image x="80" y="72" width="220" height="58" href="__LOGO_URI__" xlink:href="__LOGO_URI__"/>{{/logo_uri}}

  <text x="80" y="245" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-weight="600" font-size="20" letter-spacing="3" fill="#eab308">{{category_label}}</text>

  <text x="80" y="320" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-weight="800" font-size="{{title_font_size}}" letter-spacing="-2" fill="#ffffff">
      {{title_tspans}}
  </text>

  <line x1="80" y1="555" x2="140" y2="555" stroke="#eab308" stroke-width="2"/>

  <text x="80" y="588" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-weight="400" font-size="20" fill="#9c9a92">{{author_name}}  ·  {{date_formatted}}</text>

  <g transform="translate(1020, 585)">
    <circle cx="0" cy="-5" r="4.5" fill="#eab308"/>
    <text x="13" y="0" font-family="-apple-system, Helvetica, Arial, sans-serif"
          font-weight="500" font-size="16" letter-spacing="1.3" fill="#faf9f5">{{brand_label}}</text>
  </g>
</svg>
